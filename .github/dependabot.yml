version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      egui-stack:
        patterns:
          - "eframe"
          - "egui*"
          - "emath"
          - "epaint"
          - "ecolor"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
