[package]
name = "paintatlas"
version = "0.1.0"
edition = "2024"
description = "Cross-platform raster drawing studio"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui-wgpu = { version = "0.33", default-features = true }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
png = "0.18"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
arboard = "3.7"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
tempfile = "3"
egui_dock = { version = "0.18", path = "vendor/egui_dock", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
evdev = "0.13"
x11-dl = "2.21"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

winit = { path = "vendor/winit" }
